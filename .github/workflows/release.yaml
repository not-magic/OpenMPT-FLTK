name: Release

# Builds the Linux binary and attaches OpenMPT-linux.zip to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake rsync pkg-config zlib1g-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libfontconfig1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libpango1.0-dev libcairo2-dev libdecor-0-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build OpenMPT

      - name: Zip binary
        run: |
          mkdir OpenMPT
          cp build/bin/OpenMPT LICENSE OpenMPT/
          zip -r OpenMPT-linux.zip OpenMPT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: OpenMPT-linux.zip
          generate_release_notes: true
