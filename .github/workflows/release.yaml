name: Release

# Builds the Linux binary and attaches OpenMPT-linux.zip to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake rsync pkg-config zlib1g-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libfontconfig1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libpango1.0-dev libcairo2-dev libdecor-0-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build OpenMPT

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: OpenMPT-bin-linux
          path: build/bin/OpenMPT

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: OpenMPT-bin-linux
          path: OpenMPT

      - name: Zip binary
        run: |
          chmod +x OpenMPT/OpenMPT
          cp LICENSE OpenMPT/LICENSE
          zip -r OpenMPT-linux.zip OpenMPT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: OpenMPT-linux.zip
          generate_release_notes: true
